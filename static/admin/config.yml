# Sveltia CMS configuration: https://sveltiacms.app/en/docs
backend:
  name: github
  repo: xmartlabs/xl-blog
  branch: main
  # Sveltia CMS Additions worker (Cloudflare) that handles GitHub sign-in.
  # Placeholder URL: replace it with the deployed worker's URL.
  auth_type: additions
  base_url: https://cms-auth.xmartlabs.com
  commit_messages:
    create: 'Create {{collection}} “{{slug}}”'
    update: 'Update {{collection}} “{{slug}}”'
    delete: 'Delete {{collection}} “{{slug}}”'
    uploadMedia: '[skip ci] Upload “{{path}}”'
    deleteMedia: '[skip ci] Delete “{{path}}”'

publish_mode: preview

media_folder: static/images
public_folder: /images

site_url: https://blog.xmartlabs.com

collections:
  - name: blog
    label: Blog
    folder: blogs
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    identifier_field: title
    fields:
      - name: title
        label: Title
        required: true
        pattern: ['.{12,}', 'Must have at least 12 characters']
      - { name: subtitle, label: Subtitle, widget: string, required: false }
      - name: permalink
        label: Permalink
        hint: 'The post URL is /blog/<permalink in kebab-case>/'
        required: true
        pattern: ['.{12,}', 'Must have at least 12 characters']
      - name: featured
        label: Featured Post
        widget: boolean
        default: false
        required: false
      - name: date
        label: Date
        widget: datetime
        format: 'YYYY-MM-DD'
        time_format: false
        picker_utc: true
      - name: category
        label: Category
        widget: relation
        collection: categories
        value_field: '{{slug}}'
        search_fields: [name]
        display_fields: [name]
      - name: thumbnail
        label: Thumbnail Image
        widget: image
        choose_url: true
        required: false
      - { name: tags, label: Tags, widget: list, min: 1, max: 5 }
      - name: author
        label: Author
        widget: relation
        collection: authors
        value_field: '{{slug}}'
        search_fields: [name]
        display_fields: [name]
      - { name: body, label: Body, widget: markdown }

  - name: blogMDX
    label: Blog (MDX, advanced)
    folder: blogs
    extension: mdx
    format: frontmatter
    create: true
    slug: '{{slug}}'
    identifier_field: title
    fields:
      - name: title
        label: Title
        required: true
        pattern: ['.{12,}', 'Must have at least 12 characters']
      - { name: subtitle, label: Subtitle, widget: string, required: false }
      - name: permalink
        label: Permalink
        hint: 'The post URL is /blog/<permalink in kebab-case>/'
        required: true
        pattern: ['.{12,}', 'Must have at least 12 characters']
      - name: featured
        label: Featured Post
        widget: boolean
        default: false
        required: false
      - name: date
        label: Date
        widget: datetime
        format: 'YYYY-MM-DD'
        time_format: false
        picker_utc: true
      - name: category
        label: Category
        widget: relation
        collection: categories
        value_field: '{{slug}}'
        search_fields: [name]
        display_fields: [name]
      - name: thumbnail
        label: Thumbnail Image
        widget: image
        choose_url: true
        required: false
      - { name: tags, label: Tags, widget: list, min: 1, max: 5 }
      - name: author
        label: Author
        widget: relation
        collection: authors
        value_field: '{{slug}}'
        search_fields: [name]
        display_fields: [name]
      - { name: body, label: Body, widget: markdown }

  - name: authors
    label: Authors
    folder: content/authors
    extension: yml
    format: yaml
    create: true
    identifier_field: name
    fields:
      - { name: name, label: Name }
      - name: image
        label: Image
        widget: image
        media_folder: /static/images/members
        public_folder: /images/members
      - { name: profile_url, label: Profile URL }
      - { name: github, label: GitHub user, required: false }
      - { name: twitter, label: Twitter user, required: false }

  - name: categories
    label: Categories
    folder: content/categories
    extension: yml
    format: yaml
    create: true
    identifier_field: name
    fields:
      - { name: name, label: Name }
      - { name: order, label: Order, widget: number, value_type: int }
