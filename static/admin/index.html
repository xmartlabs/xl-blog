<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    // Netlify's Git Gateway answers 431 when the request it forwards to GitHub has too many header bytes.
    // It authenticates with the Authorization header, so cookies, referer and Content-Type on GETs are dead weight.
    (function () {
      var nativeFetch = window.fetch.bind(window);
      window.fetch = function (input, init) {
        var url = String(input instanceof Request ? input.url : input);
        if (url.indexOf('/.netlify/git/') === -1) return nativeFetch(input, init);

        var options = Object.assign({}, init, { credentials: 'omit', referrerPolicy: 'no-referrer' });
        if ((options.method || 'GET').toUpperCase() === 'GET' && options.headers) {
          var headers = new Headers(options.headers);
          headers.delete('Content-Type');
          options.headers = headers;
        }
        return nativeFetch(input, options);
      };
    })();
  </script>
</head>
<body>
  <!-- Include the script that builds the page and powers Netlify CMS -->
  <script src="https://unpkg.com/netlify-cms@2.10.192/dist/netlify-cms.js"></script>
</body>
</html>
